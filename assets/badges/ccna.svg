<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 340" width="340" height="340">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1b6fbe"/>
      <stop offset="100%" stop-color="#0d3d6e"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="170" cy="170" r="165" fill="url(#bg)"/>
  <circle cx="170" cy="170" r="165" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.15"/>

  <!-- Inner ring -->
  <circle cx="170" cy="170" r="148" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Cisco bridge logo (simplified) -->
  <g fill="#ffffff" opacity="0.95" filter="url(#glow)">
    <!-- 6 bars of the Cisco logo -->
    <rect x="105" y="118" width="12" height="26" rx="6"/>
    <rect x="124" y="106" width="12" height="38" rx="6"/>
    <rect x="143" y="96"  width="12" height="48" rx="6"/>
    <rect x="162" y="106" width="12" height="38" rx="6"/>
    <rect x="181" y="118" width="12" height="26" rx="6"/>
    <rect x="200" y="106" width="12" height="38" rx="6"/>
    <rect x="219" y="96"  width="12" height="48" rx="6"/>
  </g>

  <!-- CCNA text -->
  <text x="170" y="198" text-anchor="middle"
        font-family="'Arial Black', Arial, sans-serif"
        font-size="42" font-weight="900" letter-spacing="3"
        fill="#ffffff">CCNA</text>

  <!-- Subtitle -->
  <text x="170" y="222" text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="13" font-weight="400" letter-spacing="1"
        fill="#a8cdf0">Cisco Certified</text>
  <text x="170" y="238" text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="13" font-weight="400" letter-spacing="1"
        fill="#a8cdf0">Network Associate</text>

  <!-- Bottom CISCO wordmark -->
  <text x="170" y="282" text-anchor="middle"
        font-family="'Arial Black', Arial, sans-serif"
        font-size="20" font-weight="900" letter-spacing="5"
        fill="#ffffff" opacity="0.7">CISCO</text>
</svg>
