<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 340" width="340" height="340">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#c8102e"/>
      <stop offset="100%" stop-color="#7a0014"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="170" cy="170" r="165" fill="url(#bg)"/>
  <circle cx="170" cy="170" r="165" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.15"/>
  <circle cx="170" cy="170" r="148" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Shield icon -->
  <g transform="translate(170,110)" filter="url(#glow)">
    <path d="M0,-44 L38,-26 L38,8 C38,30 22,48 0,56 C-22,48 -38,30 -38,8 L-38,-26 Z"
          fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" opacity="0.9"/>
    <!-- Lock body -->
    <rect x="-13" y="-4" width="26" height="20" rx="3" fill="#ffffff" opacity="0.9"/>
    <!-- Lock shackle -->
    <path d="M-9,-4 L-9,-13 C-9,-21 9,-21 9,-13 L9,-4"
          fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
    <!-- Keyhole -->
    <circle cx="0" cy="5" r="4" fill="#c8102e"/>
  </g>

  <!-- Security+ text -->
  <text x="170" y="208" text-anchor="middle"
        font-family="'Arial Black', Arial, sans-serif"
        font-size="32" font-weight="900" letter-spacing="1"
        fill="#ffffff" filter="url(#glow)">Security+</text>

  <!-- Subtitle -->
  <text x="170" y="230" text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12" letter-spacing="1"
        fill="#f4a4b0">CompTIA · SY0-701</text>

  <!-- Bottom wordmark -->
  <text x="170" y="279" text-anchor="middle"
        font-family="'Arial Black', Arial, sans-serif"
        font-size="15" font-weight="900" letter-spacing="4"
        fill="#ffffff" opacity="0.65">CompTIA</text>
</svg>
